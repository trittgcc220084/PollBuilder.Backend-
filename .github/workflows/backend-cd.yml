name: Backend CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 1 service lỗi sẽ không làm dừng các service khác
      matrix:
        include:
          - folder: PollBuilder.API
            image: pollbuilder-api
          - folder: AccountService
            image: pollbuilder-accountservice
          - folder: Gateway
            image: pollbuilder-gateway
          - folder: PollService
            image: pollbuilder-pollservice
          - folder: RealtimeService
            image: pollbuilder-realtimeservice
          - folder: VoteService
            image: pollbuilder-voteservice

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image for ${{ matrix.folder }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.folder }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
