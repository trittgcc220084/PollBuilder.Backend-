name: Backend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'PollService/**'
      - 'VoteService/**'
      - 'RealtimeService/**'
      - 'Gateway/**'
      - 'AccountService/**'
      - 'PollBuilder.API/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PollBuilder.API.slnx

      - name: Build solution
        run: dotnet build PollBuilder.API.slnx -c Release --no-restore

      - name: Unit tests
        run: |
          if [ -d "PollBuilder.Tests" ]; then
            dotnet test PollBuilder.Tests/*.csproj -c Release --no-build
          else
            echo "No test project found, skipping tests."
          fi
